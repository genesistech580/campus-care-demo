<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Care · Project demo</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 1rem/1.5 system-ui, sans-serif; color: #181742; background: #efeff3; }
  header { background: #2c2b7c; color: white; border-bottom: 4px solid #cd0000; padding: 2rem 1rem; }
  header > div, main { max-width: 40rem; margin: auto; }
  h1, h2, p { margin: 0 0 .65rem; }
  main { padding: 1.5rem 1rem; }
  section { background: white; border-radius: .9rem; padding: 1.25rem; margin-bottom: 1rem; }
  label { display: block; font-weight: 600; margin-top: .75rem; }
  select, button { width: 100%; padding: .7rem; border-radius: .45rem; font: inherit; }
  select { border: 1px solid #77779e; color: inherit; background: white; }
  button { margin-top: 1rem; border: 0; background: #cd0000; color: white; font-weight: 700; cursor: pointer; }
  button:disabled { background: #efeff3; color: #181742; cursor: default; }
  li { padding: .2rem 0; }
  [aria-current="step"] { color: #2c2b7c; font-weight: 800; }
</style>
<header><div><h1>Campus Care</h1><p>UEW student project demo</p></div></header>
<main>
  <p>Try the maintenance workflow with fictional data. This demo does not send reports or collect personal information.</p>
  <section>
    <h2>Report a sample fault</h2>
    <form id="sample">
      <label for="fault">Fault</label>
      <select id="fault">
        <option value="Electrical">Ceiling light stopped working</option>
        <option value="Plumbing and Water">Water leaking from a tap</option>
        <option value="Carpentry">Broken lecture desk</option>
      </select>
      <label for="campus">Campus</label>
      <select id="campus"><option>South Campus</option><option>Centre Campus</option><option>North Campus</option></select>
      <button>Submit sample report</button>
    </form>
  </section>
  <section id="report" hidden>
    <h2>Track the report</h2>
    <p id="summary"></p>
    <ol id="timeline">
      <li>Submitted</li><li>Assigned</li><li>In progress</li><li>Resolved</li><li>Closed</li>
    </ol>
    <p id="status" role="status"></p>
    <button id="advance" type="button"></button>
  </section>
</main>
<script>
  const stages = [...document.querySelectorAll('#timeline li')];
  const actions = ['Assign technician', 'Start repair', 'Mark resolved', 'Confirm repair', 'Repair confirmed'];
  const advance = document.querySelector('#advance');
  let step = 0;
  function showStep() {
    for (const [index, item] of stages.entries()) {
      if (index === step) item.setAttribute('aria-current', 'step');
      else item.removeAttribute('aria-current');
    }
    document.querySelector('#status').textContent = 'Status: ' + stages[step].textContent;
    advance.textContent = actions[step];
    advance.disabled = step === stages.length - 1;
  }
  document.querySelector('#sample').addEventListener('submit', (event) => {
    event.preventDefault();
    const unit = document.querySelector('#fault').value;
    const campus = document.querySelector('#campus').value;
    document.querySelector('#summary').textContent = campus + ' · ' + unit;
    document.querySelector('#report').hidden = false;
    step = 0;
    showStep();
    advance.focus();
  });
  advance.addEventListener('click', () => {
    if (step < stages.length - 1) step++;
    showStep();
  });
</script>
</html>
